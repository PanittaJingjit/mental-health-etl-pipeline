services:

  mysql:
    image: mysql:8.0

    container_name: mental_health_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mental_health_db
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  airflow-init:
    build: .

    depends_on:
      - mysql

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://airflow:airflow@mysql:3306/mental_health_db

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW_UID: 50000

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com
      "

  airflow-webserver:
    build: .

    container_name: airflow_webserver

    restart: always

    depends_on:
      - mysql
      - airflow-init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://airflow:airflow@mysql:3306/mental_health_db

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW_UID: 50000

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs

    ports:
      - "8080:8080"

    command: webserver

  airflow-scheduler:
    build: .

    container_name: airflow_scheduler

    restart: always

    depends_on:
      - mysql
      - airflow-init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://airflow:airflow@mysql:3306/mental_health_db

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW_UID: 50000

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs

    command: scheduler

volumes:
  mysql_data: